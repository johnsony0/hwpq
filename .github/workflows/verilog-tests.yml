name: Verilog Module Tests

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  simulate:
    name: ${{ matrix.module }}
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/${{ github.repository }}:latest
      options: --user root
    strategy:
      fail-fast: false
      matrix:
        include:
          - module: register_array
            tb: "hwpq/register_array/rtl/sim/register_array_tb.sv"
            top: register_array_tb

          - module: register_array_pipelined
            tb: "hwpq/register_array_pipelined/rtl/sim/register_array_pipelined_tb.sv"
            top: register_array_pipelined_tb

          - module: register_tree
            tb: "hwpq/register_tree/rtl/sim/register_tree_tb.sv"
            top: register_tree_tb

          - module: register_tree_pipelined
            tb: "hwpq/register_tree_pipelined/rtl/sim/register_tree_pipelined_tb.sv"
            top: register_tree_pipelined_tb

          - module: systolic_array
            tbs: '["hwpq/systolic_array/rtl/sim/systolic_array_tb.sv", "hwpq/systolic_array/rtl/sim/systolic_array_bug_tb.sv"]'
            tops: '["systolic_array_tb", "systolic_array_bug_tb"]'

          - module: bram_tree
            tb: "hwpq/bram_tree/rtl/sim/bram_tree_tb.sv"
            top: bram_tree_tb

          - module: bram_tree_pipelined
            tb: "hwpq/bram_tree_pipelined/rtl/sim/pipelined_bram_tree_tb.sv"
            top: bram_tree_tb

          - module: hybrid_tree
            tb: "hwpq/hybrid_tree/rtl/sim/hybrid_tree_tb.sv"
            top: hybrid_tree_tb

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure environment tools are ready
        run: |
          if ! command -v iverilog &> /dev/null; then
            apt-get update && apt-get install -y iverilog grep
          fi
          iverilog -V | head -n 1

      - name: Run ${{ matrix.module }} testbench
        run: |
          chmod +x scripts/run_sim.sh

          #If it is a scalar we run just one, if it is an array we loop through and run each
          if echo '${{ matrix.tbs }}' | grep -q '\['; then
            TBS_ARRAY=($(echo '${{ matrix.tbs }}' | jq -r '.[]'))
            TOPS_ARRAY=($(echo '${{ matrix.tops }}' | jq -r '.[]'))
            
            for i in "${!TBS_ARRAY[@]}"; do
              echo "Executing testbench: ${TBS_ARRAY[$i]} (${TOPS_ARRAY[$i]})"
              scripts/run_sim.sh "${{ matrix.module }}" "${TBS_ARRAY[$i]}" "${TOPS_ARRAY[$i]}"
            done
          else
            scripts/run_sim.sh "${{ matrix.module }}" "${{ matrix.tb }}" "${{ matrix.top }}"
          fi

      - name: Upload simulation log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sim-log-${{ matrix.module }}
          path: build/${{ matrix.module }}/sim.log
          if-no-files-found: ignore